<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Park Et!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --card:#FFFFFF; --card-edge:#CBD3E1; --card-ink:#1F2547; --card-soft:#5D6585;
  --chip:#EEF2F8; --chip-ink:#1F2547; --hud:rgba(255,255,255,.22); --hud-ink:#FFFFFF;
  --veil:rgba(20,10,50,.55); --sky-dim:rgba(0,0,0,0);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --card:#262B4A; --card-edge:#14172C; --card-ink:#F2F4FF; --card-soft:#A9B0D3;
    --chip:#323862; --chip-ink:#F2F4FF; --hud:rgba(255,255,255,.16); --veil:rgba(5,5,20,.66); --sky-dim:rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --card:#262B4A; --card-edge:#14172C; --card-ink:#F2F4FF; --card-soft:#A9B0D3;
  --chip:#323862; --chip-ink:#F2F4FF; --hud:rgba(255,255,255,.16); --veil:rgba(5,5,20,.66); --sky-dim:rgba(0,0,0,.28);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  --sky1:#38C8FF; --sky2:#7B5CFF;
  background:
    linear-gradient(var(--sky-dim),var(--sky-dim)),
    radial-gradient(120% 70% at 0% 0%, rgba(255,255,255,.35), transparent 55%),
    radial-gradient(90% 60% at 100% 100%, rgba(255,255,255,.2), transparent 60%),
    linear-gradient(165deg,var(--sky1),var(--sky2));
  background-color:var(--sky2);
  color:#fff; font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}
body[data-sky="1"]{--sky1:#1C2260;--sky2:#5B1E8C}
body[data-sky="2"]{--sky1:#3A7EA0;--sky2:#17283A}
body[data-sky="3"]{--sky1:#7FB8FF;--sky2:#A98CFF}
body[data-sky="4"]{--sky1:#FFA25A;--sky2:#FF4F7B}
body[data-sky="5"]{--sky1:#F6B26B;--sky2:#B4507A}
body[data-sky="6"]{--sky1:#2A0B4F;--sky2:#0B1A4F}
body[data-sky="7"]{--sky1:#FFD27A;--sky2:#F08A4B}
body[data-sky="8"]{--sky1:#3A3E48;--sky2:#121317}
body[data-sky="9"]{--sky1:#5EC8FF;--sky2:#2E6CF2}
body::before{
  content:"";position:fixed;top:0;bottom:0;left:-60%;right:-60%;pointer-events:none;z-index:0;opacity:.75;
  background:
    radial-gradient(70px 26px at 12% 9%,rgba(255,255,255,.75),transparent 70%),
    radial-gradient(110px 34px at 16% 11%,rgba(255,255,255,.55),transparent 70%),
    radial-gradient(90px 28px at 46% 5%,rgba(255,255,255,.6),transparent 70%),
    radial-gradient(130px 40px at 72% 13%,rgba(255,255,255,.55),transparent 70%),
    radial-gradient(80px 24px at 88% 7%,rgba(255,255,255,.65),transparent 70%),
    radial-gradient(100px 30px at 30% 92%,rgba(255,255,255,.25),transparent 70%),
    radial-gradient(120px 34px at 80% 95%,rgba(255,255,255,.22),transparent 70%);
  animation:drift 90s linear infinite alternate;
}
body[data-sky="1"]::before,body[data-sky="6"]::before,body[data-sky="8"]::before{opacity:.1}
body[data-sky="2"]::before{opacity:.45;filter:grayscale(1)}
@keyframes drift{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
body[data-sky="1"]::after,body[data-sky="6"]::after{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.7;z-index:0;
  background-image:
    radial-gradient(2px 2px at 12% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 30% 8%,#fff,transparent),
    radial-gradient(2px 2px at 64% 14%,#fff,transparent),radial-gradient(1.5px 1.5px at 82% 26%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 48% 4%,#fff,transparent),radial-gradient(2px 2px at 92% 8%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 6% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 96% 44%,#fff,transparent);
}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative;z-index:1}

.hud{display:grid;grid-template-columns:50px 1fr 64px;align-items:center;gap:8px;padding:10px 12px 2px}
.hbtn{width:48px;height:48px;border-radius:15px;border:0;background:var(--hud);color:var(--hud-ink);display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.scorebox{text-align:center}
.scoreline{display:inline-flex;align-items:center;gap:6px}
.coin{display:inline-block;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#FFF7C2,#FFC72C 48%,#E09A00);box-shadow:inset 0 -3px 0 #B87A00,0 2px 0 rgba(0,0,0,.25)}
.coin.pulse{animation:bump .25s ease}
.score{font-family:"Lilita One","Rubik",sans-serif;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 3px 0 rgba(0,0,0,.25),0 0 22px rgba(255,255,255,.35);display:inline-block}
.score.bump{animation:bump .32s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.2)}100%{transform:scale(1)}}
.best{font-size:.82rem;font-weight:700;opacity:.95;margin-top:2px}
.best b{color:#FFE066;font-weight:900}
.best.beat b{color:#FFFFFF;text-shadow:0 0 10px #FF6BD6}
.floorbadge{justify-self:end;width:62px;height:56px;border-radius:16px;background:linear-gradient(#FFE066,#FFB703);color:#4A2B00;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 #C77F00,0 8px 16px rgba(0,0,0,.2);font-weight:700;font-size:.72rem;line-height:1.1}
.floorbadge b{font-family:"Lilita One","Rubik",sans-serif;font-weight:400;font-size:1.7rem;line-height:1}
.subhud{display:flex;align-items:center;gap:8px;padding:6px 12px 0}
.prog{flex:1;height:26px;border-radius:13px;background:rgba(0,0,0,.3);position:relative;overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.35)}
#progFill{position:absolute;top:0;bottom:0;left:0;width:0;background:linear-gradient(90deg,#8CFFC0,#22C97A);border-radius:13px;transition:width .35s ease}
#progFill::after{content:"";position:absolute;left:6px;right:6px;top:3px;height:6px;border-radius:3px;background:rgba(255,255,255,.45)}
#progTxt{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:.82rem;text-shadow:0 1px 3px rgba(0,0,0,.65);white-space:nowrap}
.rulechip{height:28px;min-width:28px;padding:0 8px;border-radius:14px;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.28);color:#fff;font-size:.9rem;cursor:pointer;display:flex;align-items:center;gap:1px;line-height:1}
.combo{display:none;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:14px;background:linear-gradient(#FFA03D,#FF3D6E);font-family:"Lilita One","Rubik",sans-serif;font-size:1.05rem;box-shadow:0 3px 0 #B3214A}
.combo.on{display:flex}
.combo.pop{animation:bump .3s ease}
.pips i{display:inline-block;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);margin-left:3px}
.pips i.f{background:#fff}

#stage{flex:1;min-height:0;position:relative}
canvas{display:block;width:100%;height:100%;touch-action:none}

.powers{display:flex;gap:14px;padding:4px 16px 12px;justify-content:center}
.pw{position:relative;flex:1;max-width:200px}
.power{--edge:#B23A1B;width:100%;height:56px;border:0;border-radius:17px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:"Lilita One","Rubik",sans-serif;font-size:1.15rem;color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--edge),0 10px 18px rgba(0,0,0,.2);text-shadow:0 2px 0 rgba(0,0,0,.2);-webkit-touch-callout:none;transition:transform .08s}
.power:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.power.tow{background:linear-gradient(#FF9A6B,#F2542D)}
.power.vale{--edge:#2447A8;background:linear-gradient(#7DBDFF,#3B6FF2)}
.power .pi{font-size:1.4rem;text-shadow:none}
.power b{background:#fff;color:#1F2547;border-radius:10px;min-width:26px;height:26px;display:grid;place-items:center;font:900 .9rem/1 "Rubik",sans-serif;text-shadow:none;padding:0 5px}
.power.active{outline:4px solid #FFE066;outline-offset:2px}
.power.empty{filter:grayscale(.85) brightness(.85)}
.qm{position:absolute;top:-9px;right:-7px;width:28px;height:28px;border-radius:50%;border:3px solid #fff;background:#1F2547;color:#fff;font:900 .85rem/1 "Rubik",sans-serif;cursor:pointer;display:grid;place-items:center;padding:0}

#banner{position:absolute;left:0;right:0;top:20%;display:flex;justify-content:center;pointer-events:none;z-index:6;opacity:0}
#banner.show{animation:bIn .55s cubic-bezier(.2,1.6,.4,1) forwards}
#banner.hide{animation:bOut .3s ease forwards}
@keyframes bIn{from{opacity:0;transform:scale(.4) rotate(-6deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes bOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.15)}}
.bwrap{background:linear-gradient(#FFE97A,#FFB703);color:#4A2B00;border-radius:24px;padding:12px 24px 16px;text-align:center;box-shadow:0 8px 0 #C77F00,0 20px 40px rgba(0,0,0,.4);border:4px solid #fff;max-width:86%}
#banner.record .bwrap,#banner.reward .bwrap{background:linear-gradient(#FFA6E6,#B05CFF);color:#fff;box-shadow:0 8px 0 #7A2FC0,0 20px 40px rgba(0,0,0,.4)}
#banner.reward .bwrap{background:linear-gradient(#8CFFC0,#1FBF6A);color:#06371D;box-shadow:0 8px 0 #128049,0 20px 40px rgba(0,0,0,.4)}
.bwrap .stars{font-size:1.5rem;letter-spacing:.25em;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.bwrap h2{font-family:"Lilita One","Rubik",sans-serif;font-weight:400;font-size:2.6rem;margin:0;line-height:1.05}
.bwrap p{margin:3px 0 0;font-weight:700;font-size:1rem}
.bwrap p.small{font-size:.85rem;opacity:.92}

.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:var(--veil);z-index:8;padding:16px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.ov.show{display:flex}
.card{background:var(--card);color:var(--card-ink);border-radius:26px;padding:20px 18px 22px;width:100%;max-width:370px;max-height:100%;overflow-y:auto;box-shadow:0 10px 0 var(--card-edge),0 24px 50px rgba(0,0,0,.4);text-align:center;animation:cardIn .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes cardIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.card h3{font-family:"Lilita One","Rubik",sans-serif;font-weight:400;font-size:1.9rem;margin:0 0 12px;line-height:1.1}
.card h4{font-family:"Lilita One","Rubik",sans-serif;font-weight:400;font-size:1.35rem;margin:16px 0 8px}
.card p{margin:0 0 8px;line-height:1.45}
#infoText{white-space:pre-line;text-align:left}
.logo{display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(#454B59,#2B2F3A);border-radius:20px;padding:18px 10px 26px;margin-bottom:10px;position:relative;overflow:hidden;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.logo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-linear-gradient(-45deg,#FFC72C 0 12px,#222 12px 24px)}
.logo canvas{width:58px;height:58px;flex:none}
.psign{width:54px;height:54px;border-radius:13px;background:#2F6FE0;color:#fff;font-family:"Lilita One","Rubik",sans-serif;font-size:2.3rem;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 4px 0 #1B3F8F;flex:none}
.logo h1{margin:0;font-family:"Lilita One","Rubik",sans-serif;font-weight:400;font-size:2.9rem;line-height:1;color:#FFD84D;text-shadow:0 4px 0 #B07800,0 0 24px rgba(255,216,77,.45);transform:rotate(-3deg)}
.tagline{color:var(--card-soft);font-weight:500}
.bestcard{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 2px}
.bestcard div{background:var(--chip);border-radius:14px;padding:8px 6px;font-size:.78rem;font-weight:700;color:var(--card-soft)}
.bestcard b{display:block;font-family:"Lilita One","Rubik",sans-serif;font-weight:400;font-size:1.7rem;color:var(--card-ink);line-height:1.1}
.btn{--top:#FFD84D;--bot:#F5B70F;--edge:#C98A00;--ink:#4A2B00;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:54px;border:0;border-radius:16px;background:linear-gradient(var(--top),var(--bot));color:var(--ink);font-family:"Lilita One","Rubik",sans-serif;font-size:1.3rem;margin-top:12px;box-shadow:0 5px 0 var(--edge);cursor:pointer;transition:transform .08s;padding:6px 10px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn small{font:700 .78rem/1.2 "Rubik",sans-serif;opacity:.85;margin-top:2px}
.btn.green{--top:#6CF5A6;--bot:#1FBF6A;--edge:#128049;--ink:#06371D}
.btn.blue{--top:#7DBDFF;--bot:#3B6FF2;--edge:#2447A8;--ink:#FFFFFF}
.btn.pink{--top:#FF9AC0;--bot:#FF4F8B;--edge:#B32661;--ink:#FFFFFF}
.btn.ghost{--top:var(--chip);--bot:var(--chip);--edge:var(--card-edge);--ink:var(--chip-ink);font-size:1.08rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
[hidden]{display:none !important}
.steps,.vlist{display:grid;gap:9px;text-align:left}
.step,.vrow{display:flex;gap:12px;align-items:center;background:var(--chip);border-radius:14px;padding:10px 12px;font-size:.92rem;line-height:1.4}
.step .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.vrow canvas{flex:none;width:48px;height:48px;border-radius:12px;background:#454B59}
.vrow b{display:block;font-weight:900}
.set-row{background:var(--chip);border-radius:14px;padding:12px;margin-bottom:10px;text-align:left}
.set-row .lbl{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.set-row input[type=range]{width:100%;accent-color:#FF4F8B;height:28px;margin:0}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chipbtn{height:44px;border-radius:12px;border:3px solid transparent;background:var(--card);color:var(--card-ink);font:700 .95rem "Rubik",sans-serif;cursor:pointer}
.chipbtn.on{border-color:#FF4F8B;background:#FFE3EE;color:#7A1240}
.bigscore{font-family:"Lilita One","Rubik",sans-serif;font-size:3.8rem;line-height:1;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.recbadge{display:inline-block;background:linear-gradient(#FFA6E6,#B05CFF);color:#fff;font-family:"Lilita One","Rubik",sans-serif;font-size:1.2rem;border-radius:14px;padding:6px 16px;box-shadow:0 4px 0 #7A2FC0;margin-bottom:6px;animation:wob 1.2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.06)}}
.muted{color:var(--card-soft);font-size:.92rem}
.infoic{font-size:3.2rem;line-height:1;margin:0 auto 8px;display:grid;place-items:center;min-height:72px}
.infoic canvas{width:84px;height:84px;border-radius:20px;background:#454B59}
#toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,12px);background:var(--card);color:var(--card-ink);padding:11px 15px;border-radius:14px;font-size:.92rem;font-weight:700;max-width:86%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:7;box-shadow:0 5px 0 var(--card-edge),0 10px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:3px solid #FFE066;outline-offset:3px}
@media (prefers-reduced-motion: reduce){
  body::before{animation:none}
  .card,#banner.show,#banner.hide,.recbadge,.score.bump,.combo.pop,.coin.pulse{animation:none !important}
  #banner.show{opacity:1}
}
</style>
</head>
<body data-sky="0">
<div id="app">
  <header class="hud">
    <button class="hbtn" id="pauseBtn" data-i18n-aria="pause">
      <svg width="20" height="22" viewBox="0 0 20 22" aria-hidden="true"><rect x="2" y="2" width="5.5" height="18" rx="2" fill="currentColor"/><rect x="12.5" y="2" width="5.5" height="18" rx="2" fill="currentColor"/></svg>
    </button>
    <div class="scorebox">
      <div class="scoreline"><span class="coin" id="coinIc" aria-hidden="true"></span><span class="score" id="score">0</span></div>
      <div class="best" id="bestWrap"><span data-i18n="best"></span> <b id="bestHud">0</b></div>
    </div>
    <div class="floorbadge"><span id="floorLbl" data-i18n="floorShort"></span><b id="floorNum">1</b></div>
  </header>
  <div class="subhud">
    <div class="prog"><div id="progFill"></div><span id="progTxt"></span></div>
    <div class="combo" id="combo"><span aria-hidden="true">🔥</span><span id="comboTxt">x2</span><span class="pips"><i></i><i></i></span></div>
    <button class="rulechip" id="ruleChip" data-i18n-aria="info">ℹ️</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div class="powers">
    <div class="pw">
      <button class="power tow" id="towBtn"><span class="pi" aria-hidden="true">🛻</span><span data-i18n="tow"></span><b id="towCount">1</b></button>
      <button class="qm" id="towQ" data-i18n-aria="info">?</button>
    </div>
    <div class="pw">
      <button class="power vale" id="valeBtn"><span class="pi" aria-hidden="true">🔑</span><span data-i18n="vale"></span><b id="valeCount">1</b></button>
      <button class="qm" id="valeQ" data-i18n-aria="info">?</button>
    </div>
  </div>
  <div id="toast" role="status"></div>
  <div id="banner"><div class="bwrap"><div class="stars" aria-hidden="true">★★★</div><h2 id="bTitle"></h2><p id="bSub"></p><p class="small" id="bSub2"></p><p class="small" id="bSub3"></p></div></div>

  <div class="ov" id="menuOv">
    <div class="card">
      <div class="logo"><div class="psign">P</div><h1>Park Et!</h1><span id="logoCar"></span></div>
      <p class="tagline" data-i18n="tagline"></p>
      <div class="bestcard">
        <div><span data-i18n="bestScore"></span><b id="menuBest">0</b></div>
        <div><span data-i18n="dailyBest"></span><b id="menuDaily">0</b></div>
      </div>
      <button class="btn green" id="contBtn"><span data-i18n="continue"></span><small id="contInfo"></small></button>
      <button class="btn" id="newBtn"><span data-i18n="newGame"></span></button>
      <button class="btn blue" id="dailyBtn"><span data-i18n="daily"></span></button>
      <div class="row2">
        <button class="btn ghost" id="howBtn"><span data-i18n="howTo"></span></button>
        <button class="btn ghost" id="setBtn"><span data-i18n="settings"></span></button>
      </div>
    </div>
  </div>

  <div class="ov" id="howOv">
    <div class="card">
      <h3 data-i18n="howTitle"></h3>
      <div class="steps" id="steps"></div>
      <h4 data-i18n="vehiclesTitle"></h4>
      <div class="vlist" id="vlist"></div>
      <button class="btn" id="howClose"><span data-i18n="gotIt"></span></button>
    </div>
  </div>

  <div class="ov" id="setOv">
    <div class="card">
      <h3 data-i18n="setTitle"></h3>
      <div class="set-row">
        <div class="lbl"><span data-i18n="language"></span></div>
        <div class="langs" id="langs"></div>
      </div>
      <div class="set-row">
        <div class="lbl"><label for="sfxRange" data-i18n="sfx"></label><span id="sfxVal">80%</span></div>
        <input type="range" id="sfxRange" min="0" max="100" step="5">
      </div>
      <div class="set-row">
        <div class="lbl"><label for="musRange" data-i18n="music"></label><span id="musVal">50%</span></div>
        <input type="range" id="musRange" min="0" max="100" step="5">
      </div>
      <button class="btn ghost" id="setMute"></button>
      <button class="btn blue" id="testSnd"><span data-i18n="testSound"></span></button>
      <p class="muted" data-i18n="soundTip" style="margin-top:10px"></p>
      <button class="btn pink" id="exitBtn"><span data-i18n="exitGame"></span></button>
      <button class="btn" id="setClose"><span data-i18n="close"></span></button>

    const md = danger ? 'd' : (streak >= 3 && running) ? 'c' : 'n';
    const col = md === 'd' ? 'rgba(255,40,60,' : md === 'c' ? 'rgba(255,110,40,' : (Math.sin(time * 2) > 0 ? 'rgba(255,79,216,' : 'rgba(79,227,255,');
    ctx.save(); ctx.shadowColor = col + '.95)';
    ctx.shadowBlur = cell * (.5 + .3 * Math.sin(time * (md === 'd' ? 10 : 8))) * (md === 'c' ? Math.min(2, streak / 3) : 1);
    ctx.fillStyle = col + (md === 'n' ? '.6)' : '.8)'); rr(ctx, bx - 8, by - 8, bw + 16, bh + 16 + F, 20); ctx.fill(); ctx.restore();
  }
  ctx.drawImage(lotCv, 0, 0, W, H);
  if (flashes.length) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const f of flashes) { if (f.t < 0) continue; const a = Math.max(0, 1 - f.t / .45); ctx.fillStyle = 'rgba(255,250,210,' + (a * .6) + ')'; rr(ctx, bx + f.c * cell + 2, by + f.r * cell + 2, cell - 4, cell - 4, 9); ctx.fill(); }
    ctx.restore();
  }
  for (const b of beams) {
    const a = Math.max(0, 1 - b.t / .5), w = cell * .5 * a;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,200,120,' + a + ')';
    ctx.fillRect(bx, by + (b.r + .5) * cell - w / 2, bw, w); ctx.fillRect(bx + (b.c + .5) * cell - w / 2, by, w, bh);
    ctx.restore();
  }
  if (tool === 'tow') {
    const pulse = .12 + Math.sin(time * 6) * .08;
    for (let r = 0; r < ROWS; r++) if (grid[r].some(v => v && v.type !== 'pillar')) { ctx.fillStyle = 'rgba(255,170,60,' + pulse + ')'; rr(ctx, bx + 3, by + r * cell + 3, bw - 6, cell - 6, 10); ctx.fill(); }
  }
  if (tool === 'vale') { ctx.strokeStyle = 'rgba(125,189,255,' + (.5 + Math.sin(time * 6) * .3) + ')'; ctx.lineWidth = 3; rr(ctx, bx - 3, by - 3, bw + 6, bh + 6, 15); ctx.stroke(); }
  const vs = allVehicles().sort((a, b) => (a.r + a.h) - (b.r + b.h) || a.c - b.c);
  for (const v of vs) {
    if (time < v.born) continue;
    const a = Math.min(1, (time - v.born) / .35), sc = RM ? 1 : Math.max(.3, easeOutBack(a));
    const drop = RM ? 0 : -cell * .45 * Math.pow(1 - a, 2);
    const isSel = valeFrom === v;
    if (GLOW[v.type]) {
      const pulse = .5 + .5 * Math.sin(time * (v.type === 'bomb' && v.fuse <= 2 ? 12 : 4) + v.id);
      const gr = ctx.createRadialGradient(vX(v), vY(v), cell * .1, vX(v), vY(v), cell * .75);
      gr.addColorStop(0, 'rgba(' + GLOW[v.type] + ',' + (.35 + .3 * pulse) + ')'); gr.addColorStop(1, 'rgba(' + GLOW[v.type] + ',0)');
      ctx.fillStyle = gr; ctx.fillRect(vX(v) - cell * .8, vY(v) - cell * .8, cell * 1.6, cell * 1.6);
    }
    if (isSel) { ctx.fillStyle = 'rgba(125,189,255,.45)'; rr(ctx, bx + v.c * cell + 2, by + v.r * cell + 2, cell - 4, cell - 4, 10); ctx.fill(); }
    const lift = isSel ? -cell * .12 + Math.sin(time * 8) * 2 : 0;
    const wob = v.type === 'bomb' && v.fuse <= 2 && !RM ? Math.sin(time * 30) * .05 : 0;
    drawPiece(v, vX(v), vY(v) + drop + lift, sc, 1, wob);
  }
  for (const v of vs) { if ((GLOW[v.type] || v.type === 'wreck') && time >= v.born + .2) drawBadge(v); if (v.shortLeft != null) drawShortTag(v); }
  drawWeather();
  for (const l of leaving) {
    if (l.t < 0) { drawPiece(l.v, l.x, l.y, 1); continue; }
    const p = Math.min(1, l.t / l.dur);
    if (l.mode === 'fly') {
      const hop = p < .2 ? Math.sin(p / .2 * Math.PI) * cell * .2 : 0;
      drawPiece(l.v, l.x, l.y - hop - Math.pow(Math.max(0, p - .15), 2) * cell * 4, 1 + p * .35, 1 - Math.max(0, p - .3) / .7, (l.spin || 0) * p);
    } else if (l.mode === 'tow') {

    } else if (l.mode === 'wash') {
      drawPiece(l.v, l.x, l.y - p * cell * .5, 1 - p * .7, 1 - p, (l.spin || 0) * p);
    } else if (l.mode === 'drive') {
      drawPiece(l.v, l.x, l.y + p * p * cell * 5, 1, 1 - Math.max(0, p - .5) * 2);
    }
  }
  for (const rg of rings) {
    if (rg.t < 0) continue;
    const p = Math.min(1, rg.t / .5);
    ctx.strokeStyle = rg.col; ctx.globalAlpha = 1 - p; ctx.lineWidth = 6 * (1 - p) + 1;
    ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.max * p, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
  }

  drawDoors();
  drawTray();
  for (const w of walkers) drawDriver(w);
  drawPreview();
  for (const f of floats) {
    if (f.t < 0) continue;
    const p = Math.min(1, f.t / 1.1), s = 1 + (RM ? 0 : Math.max(0, .45 - p * 2));
    ctx.save(); ctx.globalAlpha = 1 - p * p;
    ctx.font = Math.round(f.size * s) + 'px "Lilita One", Rubik, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(4, f.size * .2); ctx.strokeStyle = 'rgba(30,15,60,.85)';
    ctx.strokeText(f.text, f.x, f.y - p * cell * 1.2); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y - p * cell * 1.2);
    ctx.restore();
  }
  drawPraise();
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = 'rgba(255,240,200,' + flash + ')'; ctx.fillRect(0, 0, W, H); }
  drawCoins();
  drawParticles(true);
}

// ================= UPDATE =================
const SHIRTS = ['#FF4D5E','#3B82FF','#22C97A','#A35BFF','#FF8A2B','#1FB5C9','#F25FA0','#5C6B80'];
const SKINS = ['#F5D0B0','#E0AC80','#B9805A','#8A5A3C','#F2C29B'];
const HAIRS = ['#2B1D14','#5A3A22','#C9A35C','#1A1A1A','#8A3B1F','#D9D9D9'];
const SHIRT_FOR = { lux:'#17181D', limo:'#17181D', hc:'#2F6FE0', ev:'#1FB5C9', police:'#2148B8', fire:'#E8323C', amb:'#FFFFFF', gold:'#FFC72C', rocket:'#F4F6FA', blast:'#FF8A2B', bomb:'#1D1F26' };
function update(dt) {
  time += dt; planeT += dt;
  const live = running && !openOverlay && !trans;
  if (live) {
    for (let i = 0; i < 3; i++) {
      const p = queue[i]; if (!p) continue;
      const before = p.arr;
      p.arr += dt;
      if (before < 0 && p.arr >= 0) sfx.engine();
      if (p.arr >= ARR && !p.walked) {
        p.walked = true;
        const flashy = isFlashy(p), isVip = VIP.has(p.type);
        const pool = isVip ? t('vipLines') : p.type === 'trailer' ? t('trailerLines') : t('drivers');
        const own = t('spLine')[p.type];
        const line = own && !isVip ? own : (isVip || p.type === 'trailer' || Math.random() < .75 ? pickLine(pool) : '');
        const mood = isVip ? '😎' : p.type === 'trailer' ? '🏕️' : p.type === 'bomb' ? '😰' : p.type === 'hc' ? '😊' : flashy ? '😃' : ['😊','😄','🙂','😉','😅','🤞','😁'][Math.floor(Math.random() * 7)];
        const s = slots[i];
        if (line) for (const ow of walkers) if (ow.line) ow.life = Math.min(ow.life || 0, ow.t + .25);
        walkers.push({ x: s.cx + cell * .45, y: s.y + s.h - cell * .12, yFrom: s.y + s.h - cell * .12, yTo: lane.y + lane.h * .9, t: 0, line, life: Math.min(3.6, 1.3 + line.length * .055), pitch: 360 + Math.random() * 420, vip: isVip, cap: isVip, hot: flashy && !isVip, chair: p.type === 'hc', shirt: SHIRT_FOR[p.type] || SHIRTS[Math.floor(Math.random() * SHIRTS.length)], skin: SKINS[Math.floor(Math.random() * SKINS.length)], hair: HAIRS[Math.floor(Math.random() * HAIRS.length)] });
        sfx.door();
        if (p.type === 'hc') sfx.wheel();
        if (TIMED.has(p.type)) { p.timer = 10; p.lastSec = 10; }
        else if (fdef().patience && !SPECIAL_SET.has(p.type) && !REWARD_SET.has(p.type)) { p.timer = patienceTime(); p.lastSec = 99; }
        if (flashy) {
          floats.push({ x: s.cx, y: s.y - cell * .05, text: SPECIAL_ICON[p.type] + ' ' + t('vName')[p.type] + '!', t: 0, size: cell * .38, color: p.type === 'bomb' ? '#FF8A8A' : REWARD_SET.has(p.type) ? '#8CFFC0' : p.type === 'ev' ? '#8CF7FF' : p.type === 'hc' ? '#BFD3FF' : VIP.has(p.type) ? '#FFD84D' : '#FFE066' });
          if (p.type === 'bomb') sfx.warn(); else if (p.type === 'amb') sfx.amb(); else sfx.special();
          for (let k = 0; k < 10; k++) sparkle(s.cx, s.cy);
        }
        if (flashy && !seen[p.type]) { markSeen(p.type); showVehicleIntro(p); }
        else if (isBig(p) && !seen[p.type]) { markSeen(p.type); toast(t('vNew', { v: t('vName')[p.type] }) + '. ' + t('vDesc')[p.type]); }
      }
      if (p.timer != null && p.arr >= ARR && !openOverlay) {
        p.timer -= dt;
        if (!TIMED.has(p.type) && p.timer < 4 && !p.angry) { p.angry = true; const s2 = slots[i]; const al = pickLine(t('angryLines')); for (const ow of walkers) if (ow.line) ow.life = Math.min(ow.life || 0, ow.t + .25); walkers.push({ ghost: true, speed: 0, x: s2.cx, y: lane.y + lane.h * .9, t: 0, life: 2.4, line: al, angry: true, pitch: 240 }); horn(56, 0, .18, .05); }
        const sec = Math.ceil(p.timer);
        if (sec < p.lastSec) { p.lastSec = sec; if (sec <= 3 && sec > 0) sfx.tick(); }
        if (p.timer <= 0) {
          if (TIMED.has(p.type)) {
            if (drag && drag.slot === i) drag = null;
            if (selected === i) selected = -1;
            queue[i] = newPiece(true);
            dropCone(p.type);
            updateHud(); checkStuck(); saveGame();
          } else autoPark(i);
        }
      }
    }
    idleT -= dt;
    if (idleT <= 0) {
      idleT = 2.2 + Math.random() * 2.5;
      const vs = allVehicles().filter(v => !BLOCKERS.has(v.type));
      if (vs.length) { const v = vs[Math.floor(Math.random() * vs.length)]; particles.push({ x: vX(v) + cell * .2, y: vY(v) - cell * .5, vx: cell * .3, vy: -cell * .9, g: 0, life: 1, t: 0, color: '', s: 0, rot: 0, vr: 0, type: 'n', text: Math.random() < .5 ? '♪' : '♫' }); }
    }
  }
  fxT -= dt;
  if (fxT <= 0 && grid) {
    fxT = .12;
    for (const v of allVehicles()) {
      if (v.type === 'bomb' && Math.random() < .7) particles.push({ x: vX(v) + cell * .13, y: vY(v) - cell * .5, vx: (Math.random() - .5) * cell, vy: -cell * Math.random(), g: cell * 2, life: .35, t: 0, color: Math.random() < .5 ? '#FFE066' : '#FF8A2B', s: cell * .04, rot: 0, vr: 0, type: 's' });
      else if (v.type === 'wreck' && Math.random() < .15) smoke(vX(v), vY(v) - cell * .3, 1, true);
      else if (v.type === 'gold' && Math.random() < .4) sparkle(vX(v) + (Math.random() - .5) * cell * .5, vY(v) - cell * .3);
    }
  }
  for (const w of walkers) {
    w.t += dt; w.x += (w.speed == null ? cell * 1.5 : w.speed) * dt;
    if (w.yTo != null) w.y = w.yFrom + (w.yTo - w.yFrom) * Math.min(1, w.t / .35);
    if (w.line) { const shown = Math.floor(Math.max(0, w.t - .15) / .035); if (shown > (w.shown || 0)) { if (shown <= w.line.length && shown % 2 === 0 && w.line[shown - 1] !== ' ') sfx.blip(w.pitch); w.shown = shown; } }
  }
  walkers = walkers.filter(w => w.ghost ? w.t < w.life : (w.x < W + cell || (w.line && w.t < (w.life || 0))));

    const prev = trans.t; trans.t += dt;
    if (prev < .4 && trans.t >= .4) {
      visFloor = floor; lotDirty = true; setSky(); initWeather();
      setupFloor();
      floorBanner(true);
      updateHud();
    }
    if (prev < 1 && trans.t >= 1) sfx.ding();
    if (trans.t >= 1.45) {
      trans = null;
      const lapStart = lap() > 1 && (floor - 1) % FLOORS.length === 0;
      const unseen = rulesOf(fdef()).filter(k => !seen['rule_' + k]);
      if (lapStart && running) setTimeout(() => { if (running && !openOverlay) showLapInfo(); }, 600);

  }

    q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt;

  }

  const arrived = coins.filter(cn => cn.t >= cn.dur).length;
  if (arrived) { sfx.coin(); const ci = $('coinIc'); ci.classList.remove('pulse'); void ci.offsetWidth; ci.classList.add('pulse'); }

  for (const f of floats) f.t += dt;
  floats = floats.filter(f => f.t < 1.1);
  for (const r of rings) r.t += dt;
  rings = rings.filter(r => r.t < .5);
  for (const f of flashes) f.t += dt;
  flashes = flashes.filter(f => f.t < .45);
  for (const b of beams) b.t += dt;
  beams = beams.filter(b => b.t < .5);
  if (praise) praise.t += dt;
  if (flash > 0) flash = Math.max(0, flash - dt * 2.2);
  shake *= Math.pow(.02, dt);
  const fx = vt().fx;
  if (fx === 'rain') for (const d of weather) { d.y += d.v * dt; d.x -= d.v * dt * .15; if (d.y > bh) { d.y = -d.l - cell * .3; d.x = Math.random() * (bw + 30); } }
  if (fx === 'snow' || fx === 'leaves') for (const s of weather) { s.y += s.v * dt; s.x += Math.sin(time + s.ph) * (fx === 'leaves' ? 30 : 12) * dt; if (s.y > bh + 4) { s.y = -cell * .3; s.x = Math.random() * bw; } }
  if (fx === 'sand') for (const d of weather) { d.x += d.v * dt; if (d.x > bw) { d.x = -d.l; d.y = Math.random() * bh; } }
  if (fx === 'roof') for (const s of weather) { s.x += s.v * dt; if (s.x - s.r * 1.4 > bw) s.x = -s.r * 1.4; }
  if (shownScore !== score) {
    const prev = shownScore;
    shownScore = shownScore < score ? Math.min(score, shownScore + Math.max(1, Math.ceil((score - shownScore) * 8 * dt))) : score;
    scoreEl.textContent = shownScore;
    if (score - prev > 5 && !scoreEl.classList.contains('bump')) { scoreEl.classList.add('bump'); setTimeout(() => scoreEl.classList.remove('bump'), 330); }

}
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}

// ================= INPUT =================
function pt(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener('pointerdown', e => {
  ensureAudio();
  if (!running || openOverlay || trans) return;
  const { x, y } = pt(e);
  if (tool) { const pos = cellAt(x, y); if (pos) handleTool(pos); return; }
  const s = slotAt(x, y);
  if (s >= 0 && queue[s]) { const vs = vipSlot(); if (vs >= 0 && s !== vs) { toast(t('tVip')); sfx.bad(); return; } }
  if (s >= 0 && queue[s] && queue[s].arr >= ARR) { drag = { slot: s, x, y, sx: x, sy: y, moved: false }; sfx.pickup(); try { cv.setPointerCapture(e.pointerId); } catch (err) {} return; }
  const pos = cellAt(x, y);
  if (pos && selected >= 0 && queue[selected]) {
    const fit = fitAt(queue[selected], pos.r, pos.c);
    if (fit) placeFromSlot(selected, fit.r, fit.c); else sfx.bad();
  }
});
cv.addEventListener('pointermove', e => {
  const { x, y } = pt(e);
  if (e.pointerType === 'mouse') hover = { x, y };
  if (!drag) return;
  drag.x = x; drag.y = y;
  if (!drag.moved && Math.hypot(x - drag.sx, y - drag.sy) > 8) { drag.moved = true; selected = -1; }
});
cv.addEventListener('pointerleave', () => { hover = null; });
cv.addEventListener('pointerup', () => {
  if (!drag) return;
  if (drag.moved) { const tg = previewTarget(); if (tg && tg.ok) placeFromSlot(drag.slot, tg.r, tg.c); else if (tg && tg.on) { const why = markReason(tg.p, tg.r, tg.c); if (why) toast(why); sfx.bad(); } }
  else { selected = selected === drag.slot ? -1 : drag.slot; sfx.click(); }
  drag = null; pvKey = '';
});
cv.addEventListener('pointercancel', () => { drag = null; pvKey = ''; });

function bindPower(btn, q, name) {
  let lp = null, fired = false;
  btn.addEventListener('pointerdown', () => { fired = false; clearTimeout(lp); lp = setTimeout(() => { fired = true; if (running && !openOverlay) showInfo(name); }, 480); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => btn.addEventListener(ev, () => clearTimeout(lp)));
  btn.addEventListener('click', () => { if (fired) { fired = false; return; } setTool(name); });
  btn.addEventListener('contextmenu', e => e.preventDefault());
  q.addEventListener('click', () => { ensureAudio(); showInfo(name); });
}
bindPower($('towBtn'), $('towQ'), 'tow');
bindPower($('valeBtn'), $('valeQ'), 'vale');

const on = (id, fn) => $(id).addEventListener('click', () => { ensureAudio(); fn(); });
on('pauseBtn', () => { sfx.click(); pauseGame(); });
on('ruleChip', () => { if (running && !openOverlay && !trans) showFloorInfo(); });

on('dailyBtn', () => { sfx.click(); startGame('daily'); });
on('howBtn', () => { sfx.click(); returnTo = 'menuOv'; openOv('howOv'); });
on('setBtn', () => { sfx.click(); returnTo = 'menuOv'; openOv('setOv'); });
on('howClose', () => { sfx.click(); returnTo ? openOv(returnTo) : closeOv(); });
on('setClose', () => { sfx.click(); returnTo ? openOv(returnTo) : closeOv(); });
on('infoClose', () => { sfx.click(); returnTo ? openOv(returnTo) : closeOv(); });
on('resumeBtn', () => { sfx.click(); closeOv(); });
on('restartBtn', () => { sfx.click(); startGame(mode); });
on('pauseHow', () => { sfx.click(); returnTo = 'pauseOv'; openOv('howOv'); });
on('pauseSet', () => { sfx.click(); returnTo = 'pauseOv'; openOv('setOv'); });
on('pauseMenu', () => { sfx.click(); goMenu(); });
on('exitBtn', () => { sfx.click(); goMenu(); });
on('againBtn', () => { sfx.click(); startGame(mode); });
on('overMenu', () => { sfx.click(); openOv('menuOv'); });
on('rescueYes', () => { tow++; closeOv(); updateHud(); sfx.reward(); saveGame(); setTool('tow'); });
on('testSnd', () => { sfx.reward(); setTimeout(() => sfx.nice(), 900); });
on('rescueNo', () => { sfx.click(); closeOv(); gameOver(); });
function toggleMute() { settings.muted = !settings.muted; saveSettings(); applyVolumes(); syncSettingsUI(); if (!settings.muted) sfx.click(); }
on('setMute', toggleMute);
on('pauseMute', toggleMute);
$('sfxRange').addEventListener('input', e => { settings.sfx = +e.target.value; $('sfxVal').textContent = settings.sfx + '%'; applyVolumes(); });
$('sfxRange').addEventListener('change', () => { saveSettings(); ensureAudio(); sfx.place(); });
$('musRange').addEventListener('input', e => { settings.music = +e.target.value; $('musVal').textContent = settings.music + '%'; ensureAudio(); applyVolumes(); });
$('musRange').addEventListener('change', saveSettings);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
    if (running && !openOverlay) pauseGame();
    else if (openOverlay === 'pauseOv') closeOv();
  }
});

  if (document.hidden) { if (running && !openOverlay) openOv('pauseOv'); saveGame(); if (silentEl) try { silentEl.pause(); } catch (e) {} }
  else if (actx) { try { actx.resume(); } catch (e) {} if (silentEl) { const pr = silentEl.play(); if (pr && pr.catch) pr.catch(() => {}); } }
});
['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, ensureAudio, { capture: true, passive: true }));
window.addEventListener('pagehide', saveGame);

// ================= BOOT =================
loadSettings();
grid = emptyGrid();
queue = [null, null, null];
window.addEventListener('resize', layout);
if (window.ResizeObserver) new ResizeObserver(layout).observe(stage);
layout();
applyLang();
setSky();
$('logoCar').appendChild(makeIcon('sport', 0, 58));
openOv('menuOv');
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('40px "Lilita One"'), document.fonts.load('700 16px Rubik')]).then(() => { lotDirty = true; sprites = {}; }).catch(() => {});
}
requestAnimationFrame(loop);
})();
